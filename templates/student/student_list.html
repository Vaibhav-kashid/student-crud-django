<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student</title>
        <style>
        table, th, td {
            border: 2px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
    </style>
</head>
<body>
    <table border="5" align="center">
        <thead>
            <th>Name</th>
            <th>Email</th>
            <th>Age</th>
            <th>Course</th>
            <th>Action</th>
        </thead>
        <tbody>
            {% for student in students %}
            <tr>
                <td>{{student.name}}</td>
                <td>{{student.email}}</td>
                <td>{{student.age}}</td>
                <td>{{student.course}}</td>
                <td><a href="/edit/{{ student.id }}/">Edit</a></td>
                <td><a href="/del/{{student.id}}/">Delete</a></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="5">No of Students Found</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
