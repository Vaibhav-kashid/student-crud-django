<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit</title>
<style>
    input {
        border: 1px solid black;
        padding: 5px;
        
    }
    table, td {
        border: 1px solid black;
        border-collapse: collapse;
        padding: 8px;
    }
    form {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
</style>
</head>
<body>
    <form method="post">
        {% csrf_token %}
        <table align="center">
            {{ form.as_table }}
        </table>
        <button type="submit">Edit</button>
    </form>
</body>
</html>
